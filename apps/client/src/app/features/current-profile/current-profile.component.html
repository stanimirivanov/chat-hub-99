<section
  aria-label="Current profile"
  [attr.aria-busy]="store.isLoading() || store.isUpdating()"
>
  @if (store.profile(); as profile) {
    @if (isEditing()) {
      <form
        (submit)="
          $event.preventDefault();
          saveProfile(displayNameInput, usernameInput, avatarUrlInput)
        "
      >
        <label for="profile-display-name">Display name</label>
        <input
          #displayNameInput
          id="profile-display-name"
          name="profile-display-name"
          type="text"
          required
          [value]="profile.displayName"
          [disabled]="store.isUpdating()"
        />

        <label for="profile-username">Username</label>
        <input
          #usernameInput
          id="profile-username"
          name="profile-username"
          type="text"
          [value]="profile.username ?? ''"
          [disabled]="store.isUpdating()"
        />

        <label for="profile-avatar-url">Avatar value</label>
        <input
          #avatarUrlInput
          id="profile-avatar-url"
          name="profile-avatar-url"
          type="text"
          [value]="profile.avatarUrl ?? ''"
          [disabled]="store.isUpdating()"
        />

        <button type="submit" [disabled]="store.isUpdating()">
          @if (store.isUpdating()) {
            Saving&hellip;
          } @else {
            Save profile
          }
        </button>

        <button
          type="button"
          [disabled]="store.isUpdating()"
          (click)="cancelEdit()"
        >
          Cancel
        </button>
      </form>
    } @else {
      <strong>{{ profile.displayName }}</strong>

      @if (profile.username; as username) {
        <span>{{ '@' + username }}</span>
      }

      <button type="button" (click)="beginEdit()">Edit profile</button>
    }
  }

  <span>{{ fallbackEmail() }}</span>

  @if (store.error(); as error) {
    <span role="alert">{{ error.message }}</span>
    <button type="button" (click)="store.load(userId())">Retry profile</button>
  }

  @if (store.updateError(); as error) {
    <span role="alert">{{ error.message }}</span>
    <button type="button" (click)="store.clearUpdateError()">Dismiss</button>
  }
</section>

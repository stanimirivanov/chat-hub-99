<section aria-label="Current profile" [attr.aria-busy]="store.isLoading()">
  @if (store.profile(); as profile) {
    <strong>{{ profile.displayName }}</strong>

    @if (profile.username; as username) {
      <span>{{ '@' + username }}</span>
    }
  }

  <span>{{ fallbackEmail() }}</span>

  @if (store.error(); as error) {
    <span role="alert">{{ error.message }}</span>
    <button type="button" (click)="store.load(userId())">Retry profile</button>
  }
</section>

@if (store.isInitializing()) {
  <main>
    <p>Restoring session…</p>
  </main>
} @else if (store.isAuthenticated()) {
  <header>
    <strong>Chat Hub 99</strong>

    @if (store.session(); as session) {
      <app-current-profile
        [userId]="session.userId"
        [fallbackEmail]="session.email"
      />
    }

    <button
      type="button"
      [disabled]="store.isSigningOut()"
      (click)="store.signOut()"
    >
      @if (store.isSigningOut()) {
        Signing out…
      } @else {
        Sign out
      }
    </button>
  </header>

  <main>
    <app-workspace-navigation />
  </main>

  @if (store.error(); as error) {
    <p role="alert">
      {{ error.message }}
    </p>

    <button type="button" (click)="store.clearError()">Dismiss</button>
  }
} @else {
  <app-sign-in />
}

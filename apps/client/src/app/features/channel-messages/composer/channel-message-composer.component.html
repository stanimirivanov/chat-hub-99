<form (submit)="$event.preventDefault(); sendMessage(messageInput)">
  <label for="message-content">Message</label>

  <input
    #messageInput
    id="message-content"
    name="message-content"
    type="text"
    maxlength="4000"
    [disabled]="store.isSending()"
    (input)="typingActivity.emit()"
    (blur)="typingStopped.emit()"
  />

  <button type="submit" [disabled]="store.isSending()">
    @if (store.isSending()) {
      Sending…
    } @else {
      Send
    }
  </button>
</form>

@if (store.sendError(); as error) {
  <p role="alert">{{ error.message }}</p>
  <button type="button" (click)="store.clearSendError()">Dismiss</button>
}

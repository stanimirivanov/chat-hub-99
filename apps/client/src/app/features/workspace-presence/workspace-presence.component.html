<section aria-labelledby="workspace-presence-heading">
  <h3 id="workspace-presence-heading">Presence</h3>

  @if (store.isConnecting()) {
    <p>Connecting presence&hellip;</p>
  } @else if (store.error(); as error) {
    <p role="alert">{{ error.message }}</p>
    <button type="button" (click)="store.retry()">Retry presence</button>
  } @else {
    <p aria-live="polite">
      {{ store.onlineCount() }}
      {{ store.onlineCount() === 1 ? 'member' : 'members' }} online
    </p>
  }
</section>

name: omoikane-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ./tools/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - 4317:4317
      - 4318:4318
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.7
    command: [-config.file=/etc/tempo/config.yaml]
    volumes:
      - ./tools/observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - 3200:3200
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.12.0
    command: [--config.file=/etc/prometheus/prometheus.yaml]
    volumes:
      - ./tools/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - ${OMOIKANE_PROMETHEUS_PORT:-9090}:9090
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./tools/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 3000:3000
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:
  tempo-data:

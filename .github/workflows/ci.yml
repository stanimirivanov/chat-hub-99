name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and database
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NX_DAEMON: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Nx compares HEAD with the defaultBase configured in nx.json.
          fetch-depth: 0
          persist-credentials: false

      - name: Establish the Nx comparison base
        run: >-
          git show-ref --verify --quiet refs/heads/main ||
          git branch --track main origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: pnpm verify

      - name: Start local Supabase
        id: supabase-start
        run: pnpm dev:up

      - name: Verify database
        run: pnpm db:verify

      - name: Stop local Supabase
        if: always() && steps.supabase-start.outcome == 'success'
        run: pnpm dev:down
